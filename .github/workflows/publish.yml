name: Publish to PyPI

# Pushing a tag vX.Y.Z publishes (make bump-patch && make release), then creates the GitHub Release
# (github-release.yml). PyPI side: add a "trusted publisher" for this repository, workflow publish.yml,
# environment pypi (https://docs.pypi.org/trusted-publishers/).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine pytest jsonschema
      - run: python -m pytest -q
      - name: Tag matches the package version
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import runbook_py; print(runbook_py.__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # Trusted Publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ github.ref_name }}
