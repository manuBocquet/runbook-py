name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest (26.04) no longer has 3.8/3.9 in setup-python: test them on 24.04.
          - os: ubuntu-24.04
            python: "3.8"
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest jsonschema
      - run: python -m pytest -q

  # Python 3.6 (RHEL/Rocky 8) is no longer offered by setup-python: test it in a container.
  test-py36:
    runs-on: ubuntu-latest
    container: python:3.6-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install "pytest<7.1" "jsonschema<4"
      - run: python -m pytest -q
